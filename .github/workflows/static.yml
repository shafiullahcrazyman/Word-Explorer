name: Deploy Single HTML File

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject API Keys
        # This step replaces the placeholders in index.html with the real keys from GitHub Secrets
        run: |
          sed -i "s/__GH_SECRET_KEY_1__/${{ secrets.VITE_API_KEY }}/g" index.html
          sed -i "s/__GH_SECRET_KEY_2__/${{ secrets.VITE_API_KEY_2 }}/g" index.html
          sed -i "s/__GH_SECRET_KEY_3__/${{ secrets.VITE_API_KEY_3 }}/g" index.html
          sed -i "s/__GH_SECRET_KEY_4__/${{ secrets.VITE_API_KEY_4 }}/g" index.html
          sed -i "s/__GH_SECRET_KEY_5__/${{ secrets.VITE_API_KEY_5 }}/g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
