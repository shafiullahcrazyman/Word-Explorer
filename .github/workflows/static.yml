name: Deploy Single HTML App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject API Keys into HTML
        run: |
          sed -i "s/GH_SECRET_KEY_1/${{ secrets.GH_SECRET_KEY_1 }}/g" index.html
          sed -i "s/GH_SECRET_KEY_2/${{ secrets.GH_SECRET_KEY_2 }}/g" index.html
          sed -i "s/GH_SECRET_KEY_3/${{ secrets.GH_SECRET_KEY_3 }}/g" index.html
          sed -i "s/GH_SECRET_KEY_4/${{ secrets.GH_SECRET_KEY_4 }}/g" index.html
          sed -i "s/GH_SECRET_KEY_5/${{ secrets.GH_SECRET_KEY_5 }}/g" index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
